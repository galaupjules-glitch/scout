<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vexa</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="carte">
    <h1>Vexa</h1>
    <p class="sous-titre">Dépose une vidéo, choisis un mode, récupère une (ou plusieurs) variante(s) — chacune modifie au moins 5 caractéristiques, et aucune ne ressemble à une autre.</p>

    <div class="alerte" id="alerte-js" hidden><p id="alerte-texte"></p></div>

    <form action="{{ url_for('api_spoof') }}" method="post" enctype="multipart/form-data" id="form-spoof">
      <label class="zone-fichier" id="zone-drop">
        <input type="file" name="video" id="input-video" accept=".mp4,.mov,.m4v,.avi,.mkv,.webm" required>
        <span id="texte-fichier">Clique ou dépose ta vidéo ici</span>
      </label>

      <div class="options">
        <fieldset>
          <legend>Mode</legend>
          <label class="radio">
            <input type="radio" name="mode" value="leger" checked>
            <span>Léger</span>
            <small>Variations discrètes, rendu quasi identique à l'œil</small>
          </label>
          <label class="radio">
            <input type="radio" name="mode" value="agressif">
            <span>Agressif</span>
            <small>Variations plus marquées (cadrage, couleurs, vitesse, miroir)</small>
          </label>
        </fieldset>

        <label class="champ-nombre">
          Nombre de variantes
          <input type="number" name="count" id="input-count" value="1" min="1" max="{{ max_count }}" step="1">
        </label>

        <label class="champ-nombre">
          Pays (métadonnées)
          <select name="locale">
            <option value="">Aucun (aléatoire)</option>
            {% for code, loc in locales.items() %}
              <option value="{{ code }}" {{ "selected" if code == "us" else "" }}>{{ loc.label }}</option>
            {% endfor %}
          </select>
        </label>
      </div>

      <button type="submit" id="bouton-envoyer">Générer</button>
      <p class="note" id="note-traitement">Le traitement se fait localement, ça peut prendre un moment selon la taille de la vidéo et le nombre de variantes.</p>

      <div class="progression" id="progression" hidden>
        <div class="barre"><div class="remplissage" id="barre-remplissage"></div></div>
        <p class="etat-texte" id="etat-texte">Envoi : 0 %</p>
      </div>
    </form>
  </main>

  <script>
    const zone = document.getElementById('zone-drop');
    const input = document.getElementById('input-video');
    const texte = document.getElementById('texte-fichier');
    const form = document.getElementById('form-spoof');
    const bouton = document.getElementById('bouton-envoyer');
    const progression = document.getElementById('progression');
    const barre = document.getElementById('barre-remplissage');
    const etatTexte = document.getElementById('etat-texte');
    const alerteBox = document.getElementById('alerte-js');
    const alerteTexte = document.getElementById('alerte-texte');

    input.addEventListener('change', () => {
      if (input.files.length) {
        texte.textContent = input.files[0].name;
      }
    });

    ['dragover', 'dragenter'].forEach(ev =>
      zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.add('survol'); })
    );
    ['dragleave', 'drop'].forEach(ev =>
      zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.remove('survol'); })
    );
    zone.addEventListener('drop', e => {
      if (e.dataTransfer.files.length) {
        input.files = e.dataTransfer.files;
        texte.textContent = e.dataTransfer.files[0].name;
      }
    });

    function afficherErreur(msg) {
      alerteTexte.textContent = msg;
      alerteBox.hidden = false;
      bouton.disabled = false;
      bouton.textContent = 'Générer';
    }

    function setProgress(pct, texte) {
      barre.style.width = Math.max(0, Math.min(100, pct)) + '%';
      etatTexte.textContent = texte;
    }

    function suivreJob(jobId, total) {
      const intervalle = setInterval(() => {
        fetch(`/api/etat/${jobId}`)
          .then(r => r.json())
          .then(etat => {
            if (etat.status === 'traitement') {
              const fraction = etat.total ? etat.done / etat.total : 0;
              setProgress(45 + Math.round(fraction * 55), `Traitement : ${etat.done} / ${etat.total} variante(s)`);
            } else if (etat.status === 'termine') {
              clearInterval(intervalle);
              setProgress(100, 'Terminé !');
              window.location.href = `/resultats/${jobId}`;
            }
          })
          .catch(() => {});
      }, 700);
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      alerteBox.hidden = true;
      bouton.disabled = true;
      bouton.textContent = 'Traitement en cours...';
      progression.hidden = false;
      setProgress(0, 'Envoi : 0 %');

      const xhr = new XMLHttpRequest();
      xhr.open('POST', form.action);

      xhr.upload.addEventListener('progress', (ev) => {
        if (ev.lengthComputable) {
          const pct = Math.round((ev.loaded / ev.total) * 100);
          setProgress(Math.round(pct * 0.45), `Envoi : ${pct} %`);
        }
      });

      xhr.addEventListener('load', () => {
        let reponse = {};
        try { reponse = JSON.parse(xhr.responseText); } catch (err) { /* ignore */ }

        if (xhr.status !== 200) {
          afficherErreur(reponse.erreur || "Erreur lors de l'envoi.");
          progression.hidden = true;
          return;
        }

        setProgress(45, `Traitement : 0 / ${reponse.total} variante(s)`);
        suivreJob(reponse.job_id, reponse.total);
      });

      xhr.addEventListener('error', () => {
        afficherErreur("Erreur réseau pendant l'envoi.");
        progression.hidden = true;
      });

      xhr.send(new FormData(form));
    });
  </script>
</body>
</html>
