<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vexa</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="page">
    <header class="entete">
      <h1>Vexa</h1>
      <p class="sous-titre">Dépose ta vidéo à gauche, récupère tes variantes à droite — chacune modifie au moins 5 caractéristiques, et aucune ne ressemble à une autre.</p>
    </header>

    <div class="alerte" id="alerte-js" hidden><p id="alerte-texte"></p></div>

    <div class="colonnes">
      <!-- Dépôt (gauche) -->
      <section class="carte colonne-depot">
        <h2>Dépôt</h2>
        <form id="form-spoof">
          <label class="zone-fichier" id="zone-drop">
            <input type="file" name="video" id="input-video" accept=".mp4,.mov,.m4v,.avi,.mkv,.webm" required>
            <span id="texte-fichier">Clique ou dépose ta vidéo ici</span>
          </label>

          <div class="options">
            <fieldset>
              <legend>Mode</legend>
              <label class="radio">
                <input type="radio" name="mode" value="leger" checked>
                <span>Léger</span>
                <small>Variations discrètes, rendu quasi identique à l'œil</small>
              </label>
              <label class="radio">
                <input type="radio" name="mode" value="agressif">
                <span>Agressif</span>
                <small>Variations plus marquées (cadrage, couleurs, vitesse, miroir)</small>
              </label>
            </fieldset>

            <label class="champ-nombre">
              Nombre de variantes
              <input type="number" name="count" id="input-count" value="1" min="1" max="{{ max_count }}" step="1">
            </label>

            <label class="champ-nombre">
              Pays (métadonnées)
              <select name="locale">
                <option value="">Aucun (aléatoire)</option>
                {% for code, loc in locales.items() %}
                  <option value="{{ code }}" {{ "selected" if code == "us" else "" }}>{{ loc.label }}</option>
                {% endfor %}
              </select>
            </label>
          </div>

          <button type="submit" id="bouton-envoyer">Générer</button>
        </form>
      </section>

      <!-- Réception (droite) -->
      <section class="carte colonne-reception">
        <h2>Réception</h2>
        <p class="placeholder" id="placeholder-reception">Les variantes générées apparaîtront ici au fur et à mesure.</p>
        <div class="grille-resultats" id="grille-resultats"></div>
        <button type="button" class="bouton-telecharger-tout" id="bouton-tout" hidden>
          ⬇ Télécharger tout (<span id="nb-pretes">0</span>)
        </button>
      </section>
    </div>

    <!-- Progression (bas de page) -->
    <div class="progression" id="progression" hidden>
      <div class="barre"><div class="remplissage" id="barre-remplissage"></div></div>
      <p class="etat-texte" id="etat-texte">Envoi : 0 %</p>
    </div>
  </div>

  <script>
    const zone = document.getElementById('zone-drop');
    const input = document.getElementById('input-video');
    const texte = document.getElementById('texte-fichier');
    const form = document.getElementById('form-spoof');
    const bouton = document.getElementById('bouton-envoyer');
    const progression = document.getElementById('progression');
    const barre = document.getElementById('barre-remplissage');
    const etatTexte = document.getElementById('etat-texte');
    const alerteBox = document.getElementById('alerte-js');
    const alerteTexte = document.getElementById('alerte-texte');
    const placeholder = document.getElementById('placeholder-reception');
    const grille = document.getElementById('grille-resultats');
    const boutonTout = document.getElementById('bouton-tout');
    const nbPretes = document.getElementById('nb-pretes');

    let jobIdCourant = null;
    const dejaAffiches = new Set();

    input.addEventListener('change', () => {
      if (input.files.length) {
        texte.textContent = input.files[0].name;
      }
    });

    ['dragover', 'dragenter'].forEach(ev =>
      zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.add('survol'); })
    );
    ['dragleave', 'drop'].forEach(ev =>
      zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.remove('survol'); })
    );
    zone.addEventListener('drop', e => {
      if (e.dataTransfer.files.length) {
        input.files = e.dataTransfer.files;
        texte.textContent = e.dataTransfer.files[0].name;
      }
    });

    function afficherErreur(msg) {
      alerteTexte.textContent = msg;
      alerteBox.hidden = false;
      bouton.disabled = false;
      bouton.textContent = 'Générer';
    }

    function setProgress(pct, texte) {
      barre.style.width = Math.max(0, Math.min(100, pct)) + '%';
      etatTexte.textContent = texte;
    }

    function ajouterVariante(jobId, nom) {
      if (dejaAffiches.has(nom)) return;
      dejaAffiches.add(nom);
      placeholder.hidden = true;

      const carte = document.createElement('div');
      carte.className = 'variante';
      carte.innerHTML = `
        <video controls preload="metadata" src="/apercu/${nom}"></video>
        <a class="bouton-telecharger" href="/fichier/${nom}" download>Télécharger ${nom}</a>
      `;
      grille.appendChild(carte);

      nbPretes.textContent = dejaAffiches.size;
      boutonTout.hidden = false;
      boutonTout.onclick = () => { window.location.href = `/telecharger-tout/${jobId}`; };
    }

    function suivreJob(jobId, total) {
      const intervalle = setInterval(() => {
        fetch(`/api/etat/${jobId}`)
          .then(r => r.json())
          .then(etat => {
            (etat.resultats || []).forEach(nom => ajouterVariante(jobId, nom));

            if (etat.status === 'traitement') {
              const fraction = etat.total ? etat.done / etat.total : 0;
              setProgress(45 + Math.round(fraction * 55), `Traitement : ${etat.done} / ${etat.total} variante(s)`);
            } else if (etat.status === 'termine') {
              clearInterval(intervalle);
              setProgress(100, `Terminé ! ${etat.resultats.length} variante(s) prête(s).`);
              bouton.disabled = false;
              bouton.textContent = 'Générer';
              if (etat.erreurs && etat.erreurs.length) {
                afficherErreur(etat.erreurs.join(' / '));
              }
            }
          })
          .catch(() => {});
      }, 700);
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      alerteBox.hidden = true;
      bouton.disabled = true;
      bouton.textContent = 'Traitement en cours...';
      progression.hidden = false;
      setProgress(0, 'Envoi : 0 %');

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/spoof');

      xhr.upload.addEventListener('progress', (ev) => {
        if (ev.lengthComputable) {
          const pct = Math.round((ev.loaded / ev.total) * 100);
          setProgress(Math.round(pct * 0.45), `Envoi : ${pct} %`);
        }
      });

      xhr.addEventListener('load', () => {
        let reponse = {};
        try { reponse = JSON.parse(xhr.responseText); } catch (err) { /* ignore */ }

        if (xhr.status !== 200) {
          afficherErreur(reponse.erreur || "Erreur lors de l'envoi.");
          progression.hidden = true;
          return;
        }

        jobIdCourant = reponse.job_id;
        setProgress(45, `Traitement : 0 / ${reponse.total} variante(s)`);
        suivreJob(reponse.job_id, reponse.total);
      });

      xhr.addEventListener('error', () => {
        afficherErreur("Erreur réseau pendant l'envoi.");
        progression.hidden = true;
      });

      xhr.send(new FormData(form));
    });
  </script>
</body>
</html>
